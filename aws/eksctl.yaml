apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: wallet-eks
  region: eu-west-2

managedNodeGroups:
  - name: wallet-ng
    instanceType: t3.small
    desiredCapacity: 1
    minSize: 1
    maxSize: 2
    volumeSize: 20

iam:
  withOIDC: true
  serviceAccounts:
    - metadata:
        name: wallet-service
        namespace: wallet
      attachPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:DescribeTable
            Resource: arn:aws:dynamodb:eu-west-2:*:table/wallet-transfer-read-model
